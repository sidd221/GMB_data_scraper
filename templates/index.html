    <!-- Interactive Neural Mesh Background Canvas Engine -->
    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let mouse = { x: null, y: null, radius: 150 };

        // Color palettes for canvas based on Mode
        const colorThemes = {
            'general-google': { r: 59, g: 130, b: 246 },     // Deep Blue
            'coaching-google': { r: 168, g: 85, b: 247 },    // Royal Purple
            'bihar_directory': { r: 16, g: 185, b: 129 },    // Emerald Green
            'indiamart': { r: 0, g: 166, b: 153 }            // IndiaMART Teal
        };

        let currentCanvasColor = { ...colorThemes['general-google'] };
        let targetCanvasColor = { ...colorThemes['general-google'] };

        function updateCanvasTheme(mode) {
            let key = 'general-google';
            if (mode === 'coaching') key = 'coaching-google';
            else if (mode === 'bihar_directory') key = 'bihar_directory';
            else if (mode === 'indiamart') key = 'indiamart';
            if (colorThemes[key]) {
                targetCanvasColor = { ...colorThemes[key] };
            }
        }

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2.0 + 0.8;
                this.vx = (Math.random() - 0.5) * 0.6;
                this.vy = (Math.random() - 0.5) * 0.6;
                this.alpha = Math.random() * 0.5 + 0.3;
            }

            draw(cr, cg, cb) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${cr}, ${cg}, ${cb}, ${this.alpha})`;
                ctx.fill();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;

                // Mouse interaction with distance-squared check (fast, no sqrt)
                if (mouse.x !== null && mouse.y !== null) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const distSq = dx * dx + dy * dy;
                    const rSq = mouse.radius * mouse.radius;
                    if (distSq < rSq) {
                        const dist = Math.sqrt(distSq) || 1;
                        const force = (mouse.radius - dist) / mouse.radius;
                        this.x -= (dx / dist) * force * 2.5;
                        this.y -= (dy / dist) * force * 2.5;
                    }
                }
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.min(36, Math.floor((width * height) / 30000));
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);

            // Interpolate canvas color smoothly
            currentCanvasColor.r += (targetCanvasColor.r - currentCanvasColor.r) * 0.05;
            currentCanvasColor.g += (targetCanvasColor.g - currentCanvasColor.g) * 0.05;
            currentCanvasColor.b += (targetCanvasColor.b - currentCanvasColor.b) * 0.05;

            const cr = Math.round(currentCanvasColor.r);
            const cg = Math.round(currentCanvasColor.g);
            const cb = Math.round(currentCanvasColor.b);

            // Connect nearby particles with distance-squared (avoids thousands of Math.sqrt calls)
            const maxDist = 120;
            const maxDistSq = maxDist * maxDist;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distSq = dx * dx + dy * dy;

                    if (distSq < maxDistSq) {
                        const dist = Math.sqrt(distSq);
                        const opacity = (1 - dist / maxDist) * 0.22;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(${cr}, ${cg}, ${cb}, ${opacity})`;
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }

            // Update & draw particles without software shadowBlur
            for (let p of particles) {
                p.update();
                p.draw(cr, cg, cb);
            }

            requestAnimationFrame(animateCanvas);
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        resizeCanvas();
        animateCanvas();
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // AI Settings Modal Component
        function AISettingsModal({ isOpen, onClose, aiConfig, onConfigSaved, onToast }) {
            if (!isOpen) return null;

            const [provider, setProvider] = useState(aiConfig?.provider || 'groq');
            const [model, setModel] = useState(aiConfig?.model || 'openai/gpt-oss-120b');
            const [apiKey, setApiKey] = useState('');
            const [showKey, setShowKey] = useState(false);
            const [testing, setTesting] = useState(false);
            const [saving, setSaving] = useState(false);
            const [testResult, setTestResult] = useState(null);

            const handleProviderChange = (p) => {
                setProvider(p);
                if (p === 'groq') setModel('openai/gpt-oss-120b');
                else if (p === 'gemini') setModel('gemini-2.0-flash');
                else if (p === 'openai') setModel('gpt-4o-mini');
                setTestResult(null);
            };

            const handleKeyInput = (val) => {
                setApiKey(val);
                setTestResult(null);
                const trimmed = val.trim();
                if (trimmed.startsWith('gsk_')) {
                    setProvider('groq');
                    setModel('openai/gpt-oss-120b');
                } else if (trimmed.startsWith('AIzaSy')) {
                    setProvider('gemini');
                    setModel('gemini-2.0-flash');
                } else if (trimmed.startsWith('sk-')) {
                    setProvider('openai');
                    setModel('gpt-4o-mini');
                }
            };

            const handleTestKey = async () => {
                if (!apiKey && !aiConfig?.has_key) {
                    setTestResult({ success: false, message: 'Please enter an API key to test.' });
                    return;
                }
                setTesting(true);
                setTestResult(null);
                try {
                    const res = await fetch('/api/ai/test_key', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            provider: provider,
                            model: model,
                            api_key: apiKey
                        })
                    });
                    const data = await res.json();
                    setTestResult(data);
                } catch (err) {
                    setTestResult({ success: false, message: 'Could not connect to local server: ' + err.message });
                } finally {
                    setTesting(false);
                }
            };

            const handleSaveKey = async () => {
                if (!apiKey && !aiConfig?.has_key) {
                    alert('Please enter an API key.');
                    return;
                }
                setSaving(true);
                try {
                    const res = await fetch('/api/ai/config', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            provider: provider,
                            model: model,
                            api_key: apiKey
                        })
                    });
                    const data = await res.json();
                    if (data.success) {
                        if (onConfigSaved) onConfigSaved(data.config);
                        if (onToast) onToast(`🟢 AI Model Activated (${data.config.model})!`);
                        onClose();
                    } else {
                        alert(data.message || 'Error saving configuration');
                    }

                    alert('Error saving configuration: ' + err.message);
                } finally {
                    setSaving(false);
                }

                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ provider: 'groq', model: 'openai/gpt-oss-120b', api_key: '' })

                                        <option value="openai/gpt-oss-20b">GPT-OSS 20B (Compact Fast)</option>
                                    </>

                                        <option value="gemini-1.5-flash">Gemini 1.5 Flash (Generous Free Tier)</option>

                                        <option value="gpt-4o-mini">GPT-4o Mini (Cost-Effective & Fast)</option>

                        <div className="ai-form-group">

                                API Key {aiConfig?.has_key && <span style={{ color: '#10b981', fontWeight: 600 }}> (🔒 Active & Protected on Server)</span>}
                            </label>
                            <div className="ai-key-input-wrap">
                                <input
                                    type={showKey ? 'text' : 'password'}
                                    className="ai-key-input"
                                    value={apiKey}
                                    onChange={(e) => handleKeyInput(e.target.value)}
                                    placeholder={aiConfig?.has_key ? "Key is active on server (enter new key to update)" : "Paste gsk_..., AIzaSy..., or sk-... key"}
                                    autoComplete="off"
                                    spellCheck="false"
                                />
                                <button
                                    type="button"
                                    className="ai-eye-toggle"
                                    onClick={() => setShowKey(!showKey)}
                                    title={showKey ? "Hide key" : "Show key"}
                                >
                                    {showKey ? '👁️' : '👁️‍🗨️'}
                                </button>
                            </div>
                            <div className="ai-input-helper">
                                {provider === 'groq' ? (
                                    <span>Get free key at <a href="https://console.groq.com/keys" target="_blank" rel="noreferrer">console.groq.com</a></span>
                                ) : provider === 'gemini' ? (
                                    <span>Get free key at <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noreferrer">aistudio.google.com</a></span>
                                ) : (
                                    <span>Get key from <a href="https://platform.openai.com/api-keys" target="_blank" rel="noreferrer">platform.openai.com</a></span>
                                )}
                                <span>🔒 Protected in .env • Never exposed to client</span>
                            </div>
                        </div>

                        {testResult && (
                            <div className={`ai-test-feedback ${testResult.success ? 'success' : 'error'}`}>
                                <span>{testResult.success ? '✅' : '⚠️'}</span>
                                <span>{testResult.message}</span>
                            </div>

                        <div className="modal-actions-row">
                            <button
                                type="button"
                                className="modal-btn-test"
                                onClick={handleTestKey}
                                disabled={testing || (!apiKey && !aiConfig?.has_key)}
                            >
                                {testing ? 'Testing Connection...' : '⚡ Test Connection'}

                            <button

                                onClick={handleSaveKey}
                                disabled={saving}

                                {saving ? 'Saving...' : '💾 Save & Activate'}

                        </div>

                        {aiConfig?.has_key && (
                            <div style={{ textAlign: 'center', marginTop: '0.85rem' }}>
                                <button

                                    style={{ background: 'none', border: 'none', color: '#ef4444', fontSize: '0.75rem', cursor: 'pointer', textDecoration: 'underline' }}
                                >
                                    Disconnect Active Key
                                </button>
                            </div>

                    </div>
                </div>
            );
        }

        // Comprehensive AI Intelligence & Market Recommender Component
        function AIRecommender({ onApply, onToast, onOpenAiSettings, aiConfig }) {
            const [activeTab, setActiveTab] = useState("daily"); // 'daily' | 'research' | 'directory'

            // --- Daily AI State ---
            const [dailyData, setDailyData] = useState(null);
            const [dailyLoading, setDailyLoading] = useState(false);

            const fetchDaily = async (force = false) => {
                setDailyLoading(true);
                try {
                    const res = await fetch('/api/ai/daily', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ force: force })
                    });
                    const data = await res.json();
                    setDailyData(data);
                    if (force && onToast) {
                        onToast('✨ Refreshed Daily AI Lead Opportunities!');
                    }
                } catch (err) {
                    console.error("Error fetching daily AI recommendations:", err);
                } finally {
                    setDailyLoading(false);
                }
            };

            useEffect(() => {
                fetchDaily(false);
            }, [aiConfig?.has_key]);

            // --- Deep Research State ---
            const [researchTopic, setResearchTopic] = useState("");
            const [researchSector, setResearchSector] = useState("all");
            const [researchRegion, setResearchRegion] = useState("all");
            const [researchFocus, setResearchFocus] = useState("all");
            const [researchLoading, setResearchLoading] = useState(false);
            const [researchResult, setResearchResult] = useState(null);
            const [researchError, setResearchError] = useState("");

            const handleRunResearch = async (customTopic = null) => {
                const topicToUse = (customTopic !== null ? customTopic : researchTopic).trim();
                if (!topicToUse) {
                    alert("Please enter a research topic or click a quick prompt chip.");
                    return;
                }
                if (customTopic !== null) {
                    setResearchTopic(customTopic);
                }
                setResearchLoading(true);
                setResearchError("");
                setResearchResult(null);

                try {
                    const res = await fetch('/api/ai/deep_research', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            topic: topicToUse,
                            sector: researchSector,
                            region: researchRegion,
                            focus: researchFocus
                        })
                    });
                    const data = await res.json();
                    if (data.success && data.research) {
                        setResearchResult(data.research);
                        if (onToast) onToast(`🔬 Market research complete for "${topicToUse}"!`);
                    } else {
                        setResearchError(data.error || "Research could not be completed.");
                    }
                } catch (err) {
                    setResearchError("Failed to connect to server: " + err.message);
                } finally {
                    setResearchLoading(false);
                }
            };

            // --- Directory State (Category Directory & Google Live) ---
            const [state, setState] = useState("all");
            const [superCategory, setSuperCategory] = useState("all");
            const [subCategory, setSubCategory] = useState("all");
            const [searchQuery, setSearchQuery] = useState("");
            const [categories, setCategories] = useState([]);
            const [recommendations, setRecommendations] = useState([]);
            const [googleSync, setGoogleSync] = useState({ synced: false, count: 0, last_sync: '' });
            const [syncingGoogle, setSyncingGoogle] = useState(false);
            const [dirLoading, setDirLoading] = useState(false);

            // Client-side cache for instantaneous 0ms category switching & race-condition cancellation
            const recsCacheRef = useRef({});
            const abortControllerRef = useRef(null);
            const reqIdRef = useRef(0);

            const fetchRecs = async (st = state, sup = superCategory, sub = subCategory, q = searchQuery, force = false) => {
                const cacheKey = `${st}_${sup}_${sub}_${q.trim().toLowerCase()}`;

                // Instant cache hit: Switch category in 0ms without waiting or flashing
                if (!force && recsCacheRef.current[cacheKey]) {
                    setRecommendations(recsCacheRef.current[cacheKey]);
                    setDirLoading(false);
                    return;
                }

                // If not in cache or forced, abort previous pending fetch
                if (abortControllerRef.current) {
                    abortControllerRef.current.abort();
                }
                const controller = new AbortController();
                abortControllerRef.current = controller;
                const currentReqId = ++reqIdRef.current;

                setDirLoading(true);
                try {
                    const res = await fetch('/api/ai/recommend', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        signal: controller.signal,
                        body: JSON.stringify({
                            state: st,
                            category: sup,
                            sub_category: sub,
                            query: q,
                            limit: 18
                        })
                    });
                    const data = await res.json();
                    if (currentReqId === reqIdRef.current) {
                        const items = data.recommendations || [];
                        recsCacheRef.current[cacheKey] = items;
                        setRecommendations(items);
                        if (data.google_sync) setGoogleSync(data.google_sync);
                    }
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        console.error("Error fetching recommendations:", err);
                    }
                } finally {
                    if (currentReqId === reqIdRef.current) {
                        setDirLoading(false);
                    }
                }
            };

            useEffect(() => {
                fetch('/api/ai/categories')
                    .then(res => res.json())
                    .then(data => {
                        if (data.categories) {
                            setCategories(data.categories);
                            // Pre-warm cache for 'all' in background so opening directory is 0ms
                            fetchRecs("all", "all", "all", "", false);
                        }
                        if (data.google_sync) setGoogleSync(data.google_sync);
                    })
                    .catch(err => console.error("Error fetching categories:", err));
            }, []);

            useEffect(() => {
                if (activeTab === 'directory') {
                    fetchRecs(state, superCategory, subCategory, searchQuery);
                }
            }, [state, superCategory, subCategory, activeTab]);

            const handleSuperCategoryClick = (catId) => {
                setSuperCategory(catId);
                setSubCategory("all");
                // Check cache immediately for instant UI update!
                const cacheKey = `${state}_${catId}_all_${searchQuery.trim().toLowerCase()}`;
                if (recsCacheRef.current[cacheKey]) {
                    setRecommendations(recsCacheRef.current[cacheKey]);
                }
            };

            const handleSubCategoryClick = (subId) => {
                setSubCategory(subId);
                const cacheKey = `${state}_${superCategory}_${subId}_${searchQuery.trim().toLowerCase()}`;
                if (recsCacheRef.current[cacheKey]) {
                    setRecommendations(recsCacheRef.current[cacheKey]);
                }

                e.preventDefault();
                fetchRecs(state, superCategory, subCategory, searchQuery, true);
            };

            const handleSyncGoogle = async () => {
                setSyncingGoogle(true);
                try {
                    const res = await fetch('/api/ai/sync_google', { method: 'POST' });
                    const data = await res.json();
                    if (data.google_sync) setGoogleSync(data.google_sync);
                    recsCacheRef.current = {}; // clear cache on sync
                    fetchRecs(state, superCategory, subCategory, searchQuery, true);
                    if (onToast) onToast(`🟢 Google Live Synced: ${data.message || 'Updated!'}`);
                } catch (err) {
                    console.error("Error syncing Google keywords:", err);
                } finally {
                    setSyncingGoogle(false);
                }
            };

            const activeCategoryObj = categories.find(c => c.id === superCategory) || categories[0];
            const activeSubCategories = activeCategoryObj ? activeCategoryObj.sub_categories || [] : [];

            const researchQuickChips = [
                "Bihta Airport Corridor Commercial Plots",
                "Ranchi Ring Road Gated Township Land",
                "IIT JEE & NEET Coaching Hubs Patna",
                "Industrial Shed Contractors Adityapur",
                "Diagnostic Centers & Pathology Labs",
                "Rooftop Solar EPC Installers Bihar"
            ];

            return (
                <div className="ai-card">
                    {/* Header */}
                    <div className="ai-header-wrap">
                        <div className="ai-title-box">
                            <h2>
                                <span className="ai-sparkle-icon">✨</span>
                                AI Market Intelligence & Research
                            </h2>

            // Close city dropdown on outside click
            useEffect(() => {
                const handleClickOutside = (event) => {

                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);

            const handleSelectBiharCity = (cityName) => {
                setCity(cityName);
                setShowCityDropdown(false);

                setTimeout(() => setAppliedHighlight(false), 1200);
                handleToast(`📍 Selected ${cityName}, Bihar`);

            const filteredBiharCities = ALL_BIHAR_CITIES.filter(c => {
                if (cityRegionFilter === 'top' && !c.top) return false;
                if (cityRegionFilter === 'north' && c.region !== 'north') return false;
                if (cityRegionFilter === 'south' && c.region !== 'south') return false;

                if (city && city.trim()) {
                    const isExactSelected = ALL_BIHAR_CITIES.some(item => item.name.toLowerCase() === city.trim().toLowerCase());
                    if (!isExactSelected) {
                        const q = city.trim().toLowerCase();
                        return c.name.toLowerCase().includes(q) || c.badge.toLowerCase().includes(q);
                    }
                }
                return true;
            });

            const startScraping = async () => {
                const nicheLabel = mode === 'coaching' 
                    ? 'coaching category' 
                    : (mode === 'bihar_directory' 
                        ? 'directory category' 
                        : (mode === 'indiamart' ? 'IndiaMART product/service' : 'business niche'));
                if (!keyword.trim() || !city.trim()) {
                    alert(`Please enter both a ${nicheLabel} and a target city.`);
                    return;
                }

                setStatus("running");
                let startMsg = `Chrome is launching in the background. Searching and extracting up to ${limit} leads from Google Maps...`;
                if (mode === 'coaching') {
                    startMsg = `Searching Google Maps & verifying official websites for up to ${limit} coaching leads...`;
                } else if (mode === 'bihar_directory') {
                    const srcLabel = directorySource === 'iyp' ? 'IndianYellowPages' : (directorySource === 'ei' ? 'ExportersIndia' : 'Bihar Local Directories');
                    startMsg = `Querying bot-safe ${srcLabel} for '${keyword}' in ${city}...`;
                } else if (mode === 'indiamart') {
                    startMsg = `Launching Playwright Chromium & extracting verified B2B suppliers from IndiaMART for '${keyword}' in ${city}...`;
                }
                setStatusMessage(startMsg);
                setScrapeProgress({
                    count: 0,
                    total: limit,
                    percent: 0,
                    elapsed_seconds: 0,
                    elapsed_text: "0s",
                    eta_seconds: null,
                    eta_text: mode === 'indiamart' ? "Launching Playwright..." : "Launching Chrome & Maps...",
                    speed: "--",
                    message: startMsg
                });

                try {
                    const response = await fetch('/api/scrape', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            keyword: keyword.trim(),
                            city: city.trim(),
                            source: mode === 'bihar_directory' ? 'bihar_directory' : (mode === 'indiamart' ? 'indiamart' : 'google'),
                            target_count: limit,
                            mode: mode,
                            require_website: mode === 'coaching',
                            directory_source: directorySource
                        })
                    });

                    const data = await response.json();
                    if (data.error) throw new Error(data.error);

                    const jobId = data.job_id;
                    const pollInterval = setInterval(async () => {
                        try {
                            const statusRes = await fetch(`/api/status/${jobId}`);
                            const statusData = await statusRes.json();

                            if (statusData) {
                                if (statusData.message) {
                                    setStatusMessage(statusData.message);
                                }
                                setScrapeProgress(prev => ({
                                    count: statusData.count !== undefined ? statusData.count : prev.count,
                                    total: statusData.total || limit,
                                    percent: statusData.percent !== undefined ? statusData.percent : prev.percent,
                                    elapsed_seconds: statusData.elapsed_seconds !== undefined ? statusData.elapsed_seconds : prev.elapsed_seconds,
                                    elapsed_text: statusData.elapsed_text || prev.elapsed_text,
                                    eta_seconds: statusData.eta_seconds,
                                    eta_text: statusData.eta_text || prev.eta_text,
                                    speed: statusData.speed || prev.speed,
                                    message: statusData.message || prev.message
                                }));

                                if (statusData.status === 'completed') {
                                    clearInterval(pollInterval);
                                    setStatus("completed");
                                    setStatusMessage(statusData.message);
                                } else if (statusData.status === 'error') {
                                    clearInterval(pollInterval);
                                    setStatus("error");
                                    setStatusMessage(statusData.message);
                                }
                            }
                        } catch (err) {
                            clearInterval(pollInterval);
                            setStatus("error");
                            setStatusMessage("Connection interrupted while checking scrape progress.");
                        }
                    }, 2000);

                } catch (err) {
                    setStatus("error");
                    setStatusMessage(err.message || "Could not connect to the local server.");
                }
            };

            return (
                <motion.div

                                                        className={`preset-chip ${activeChip === preset.query ? 'active' : ''}`}
                                                        onClick={() => {
                                                            setActiveChip(preset.query);
                                                            setKeyword(preset.query);
                                                            if (!city) setCity("Patna");
                                                        }}
                                                        whileHover={{ scale: 1.04, y: -2 }}
                                                        whileTap={{ scale: 0.97 }}
                                                    >
                                                        {preset.label}
                                                    </motion.button>
                                                ))}
                                            </div>
                                        </motion.div>
                                    )}
                                </AnimatePresence>

                                {/* Coaching Quick Preset Chips */}
                                <AnimatePresence>
                                    {mode === 'coaching' && (
                                        <motion.div 
                                            className="coaching-chips"
                                            initial={{ opacity: 0, height: 0 }}
                                            animate={{ opacity: 1, height: 'auto' }}
                                            exit={{ opacity: 0, height: 0 }}
                                            transition={{ duration: 0.35 }}
                                        >
                                            <label className="chips-title">Popular Coaching Niches (Click to Auto-fill)</label>
                                            <div className="chips-container">
                                                {coachingPresetsList.map((preset, idx) => (
                                                    <motion.button
                                                        key={preset}
                                                        type="button"
                                                        className={`preset-chip ${activeChip === preset ? 'active' : ''}`}
                                                        onClick={() => handleChipClick(preset)}
                                                        whileHover={{ scale: 1.04, y: -2 }}
                                                        whileTap={{ scale: 0.97 }}
                                                    >
                                                        {preset}
                                                    </motion.button>
                                                ))}
                                            </div>
                                        </motion.div>
                                    )}
                                </AnimatePresence>

                                {/* IndiaMART Quick Preset Chips */}
                                <AnimatePresence>
                                    {mode === 'indiamart' && (
                                        <motion.div 
                                            className="coaching-chips"
                                            initial={{ opacity: 0, height: 0 }}
                                            animate={{ opacity: 1, height: 'auto' }}
                                            exit={{ opacity: 0, height: 0 }}
                                            transition={{ duration: 0.35 }}
                                        >
                                            <label className="chips-title">Popular IndiaMART B2B Categories (Click to Fill)</label>
                                            <div className="chips-container">
                                                {indiamartPresetsList.map((preset, idx) => (
                                                    <motion.button
                                                        key={preset.label}
                                                        type="button"
                                                        className={`preset-chip ${activeChip === preset.query ? 'active' : ''}`}
                                                        onClick={() => {
                                                            setActiveChip(preset.query);
                                                            setKeyword(preset.query);
                                                            if (!city) setCity("Patna");
                                                        }}
                                                        whileHover={{ scale: 1.04, y: -2 }}
                                                        whileTap={{ scale: 0.97 }}
                                                    >
                                                        {preset.label}
                                                    </motion.button>
                                                ))}
                                            </div>
                                        </motion.div>
                                    )}
                                </AnimatePresence>

                                {/* Inputs */}
                                <div className="input-group">
                                    <label htmlFor="keyword">
                                        {mode === 'bihar_directory' 
                                            ? 'Directory Business Category' 
                                            : (mode === 'coaching' 
                                                ? 'Coaching / Course Category' 
                                                : (mode === 'indiamart' ? 'IndiaMART Product / Supplier Category' : 'Business Niche'))}
                                    </label>
                                    <input 
                                        type="text" 
                                        id="keyword"
                                        className={appliedHighlight ? 'highlight-flash' : ''}
                                        value={keyword}
                                        onChange={(e) => {
                                            setKeyword(e.target.value);
                                            setActiveChip(null);
                                        }}
                                        placeholder={mode === 'bihar_directory'
                                            ? 'e.g. Real Estate Agents, Building Contractors, Hospitals'
                                            : (mode === 'coaching' 
                                                ? 'e.g. IIT JEE Coaching, NEET Academy' 
                                                : (mode === 'indiamart' ? 'e.g. pharmaceutical-distributors, chemicals, industrial-machinery' : 'e.g. Restaurants, Plumbers, Dentists, Gyms'))}
                                    />
                                </div>

                                <div className="input-group city-input-group" ref={cityDropdownRef}>
                                    <div className="city-input-label-row">
                                        <label htmlFor="city">
                                            {mode === 'bihar_directory' 
                                                ? 'Target Bihar Hub / District' 
                                                : (mode === 'coaching' 
                                                    ? 'Target City / Education Hub' 
                                                    : (mode === 'indiamart' ? 'Target City / Commercial Hub' : 'Target City / District'))}
                                        </label>
                                        <button 
                                            type="button" 
                                            className="browse-bihar-btn"
                                            onClick={() => setShowCityDropdown(prev => !prev)}
                                            title="Browse all 38 districts of Bihar"
                                        >
                                            <span>📍</span> {showCityDropdown ? 'Close Bihar Cities' : 'All 38 Bihar Districts'}
                                        </button>
                                    </div>
                                    <div className="city-input-wrapper">
                                        <input 
                                            type="text" 
                                            id="city"
                                            className={appliedHighlight ? 'highlight-flash' : ''}
                                            value={city}
                                            onFocus={() => setShowCityDropdown(true)}
                                            onClick={() => setShowCityDropdown(true)}
                                            onChange={(e) => {
                                                setCity(e.target.value);
                                                setShowCityDropdown(true);
                                            }}
                                            placeholder="Click here to select any Bihar District (e.g. Patna, Muzaffarpur, Gaya...)"
                                            autoComplete="off"
                                        />
                                        {city && (
                                            <button 
                                                type="button" 
                                                className="city-clear-btn"
                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    setCity("");
                                                    setShowCityDropdown(true);
                                                }}
                                                title="Clear field"
                                            >
                                                ✕
                                            </button>
                                        )}

                                        {/* All 38 Bihar Cities Interactive Dropdown */}
                                        <AnimatePresence>
                                            {showCityDropdown && (
                                                <motion.div 
                                                    className="bihar-cities-dropdown"
                                                    initial={{ opacity: 0, y: -10, scale: 0.98 }}
                                                    animate={{ opacity: 1, y: 0, scale: 1 }}
                                                    exit={{ opacity: 0, y: -10, scale: 0.98 }}
                                                    transition={{ duration: 0.2 }}
                                                >
                                                    <div className="bihar-cities-dropdown-header">
                                                        <div className="header-left-tag">
                                                            <span>📍</span>
                                                            <strong>All 38 Bihar Districts & Major Commercial Hubs</strong>
                                                        </div>
                                                        <button 
                                                            type="button" 
                                                            className="close-dropdown-btn"
                                                            onClick={() => setShowCityDropdown(false)}
                                                            title="Close"
                                                        >
                                                            ✕
                                                        </button>
                                                    </div>

                                                    {/* Filter Tabs */}
                                                    <div className="bihar-city-tabs">
                                                        <button 
                                                            type="button" 
                                                            className={`bihar-tab-btn ${cityRegionFilter === 'all' ? 'active' : ''}`}
                                                            onClick={() => setCityRegionFilter('all')}
                                                        >
                                                            All Districts ({ALL_BIHAR_CITIES.length})
                                                        </button>
                                                        <button 
                                                            type="button" 
                                                            className={`bihar-tab-btn ${cityRegionFilter === 'top' ? 'active' : ''}`}
                                                            onClick={() => setCityRegionFilter('top')}
                                                        >
                                                            🔥 Top Hubs (15)
                                                        </button>
                                                        <button 
                                                            type="button" 
                                                            className={`bihar-tab-btn ${cityRegionFilter === 'north' ? 'active' : ''}`}
                                                            onClick={() => setCityRegionFilter('north')}
                                                        >
                                                            🟢 North Bihar
                                                        </button>
                                                        <button 
                                                            type="button" 
                                                            className={`bihar-tab-btn ${cityRegionFilter === 'south' ? 'active' : ''}`}
                                                            onClick={() => setCityRegionFilter('south')}
                                                        >
                                                            🔵 South Bihar
                                                        </button>
                                                    </div>

                                                    {/* Cities Grid */}
                                                    <div className="bihar-cities-grid">
                                                        {filteredBiharCities.map(item => (
                                                            <button
                                                                key={item.name}
                                                                type="button"
                                                                className={`bihar-city-item ${city.toLowerCase() === item.name.toLowerCase() ? 'active' : ''}`}
                                                                onClick={() => handleSelectBiharCity(item.name)}
                                                            >
                                                                <span className="item-pin">📍</span>
                                                                <span className="item-name">{item.name}</span>
                                                                <span className="item-tag">{item.badge}</span>
                                                            </button>
                                                        ))}
                                                        {filteredBiharCities.length === 0 && (
                                                            <div className="no-cities-found">
                                                                No Bihar districts matching "{city}". You can still scrape with this custom location!
                                                            </div>
                                                        )}
                                                    </div>
                                                </motion.div>
                                            )}
                                        </AnimatePresence>
                                    </div>

                                    {/* Quick Bihar City Selector Chips */}
                                    {mode === 'bihar_directory' && (
                                        <div className="city-chips-container">
                                            {biharCities.map(c => (
                                                <button
                                                    key={c}
                                                    type="button"
                                                    className={`city-chip ${city.toLowerCase() === c.toLowerCase() ? 'active' : ''}`}
                                                    onClick={() => handleSelectBiharCity(c)}
                                                >
                                                    <span>📍</span> {c}
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                {/* Action Button */}
                                {status !== 'running' && (
                                    <motion.button 
                                        id="scrape-btn" 
                                        className="glow-button"
                                        onClick={startScraping}
                                        whileHover={{ scale: 1.02 }}
                                        whileTap={{ scale: 0.98 }}
                                    >
                                        Start Scraping {limit} {
                                            mode === 'bihar_directory' 
                                                ? 'Bihar Local Directory' 
                                                : (mode === 'coaching' 
                                                    ? 'Website-Verified Coaching' 
                                                    : (mode === 'indiamart' ? 'IndiaMART B2B' : 'Google Maps'))
                                        } Leads
                                    </motion.button>
                                )}

                                {/* Status Loading & Real-Time ETA Status Bar */}
                                <AnimatePresence>
                                    {status === 'running' && (
                                        <motion.div 
                                            id="status-container"
                                            className="scrape-progress-panel"
                                            initial={{ opacity: 0, y: 14 }}
                                            animate={{ opacity: 1, y: 0 }}
                                            exit={{ opacity: 0, scale: 0.95 }}
                                            transition={{ duration: 0.3 }}
                                        >
                                            {/* Top Header: Title & Counter */}
                                            <div className="progress-header-row">
                                                <div className="progress-title-wrap">
                                                    <div className="live-radar-dot"></div>
                                                    <div className="title-text-group">
                                                        <h3 className="progress-main-title">
                                                            {mode === 'bihar_directory' 
                                                                ? 'Extracting Bihar Directory Leads' 
                                                                : (mode === 'coaching' 
                                                                    ? 'Verifying Coaching Institutes' 
                                                                    : (mode === 'indiamart' ? 'Extracting IndiaMART B2B Suppliers' : 'Scraping Google Maps Leads'))}
                                                        </h3>
                                                        <span className="live-engine-tag">● Real-time Human Scraping Engine</span>
                                                    </div>
                                                </div>
                                                <div className="progress-counter-badge">
                                                    <span className="count-number">{scrapeProgress.count}</span>
                                                    <span className="count-sep">/</span>
                                                    <span className="total-number">{scrapeProgress.total}</span>
                                                    <span className="leads-unit">Leads</span>
                                                    <span className="percent-pill">{scrapeProgress.percent}%</span>
                                                </div>
                                            </div>

                                            {/* Glowing Progress Bar Track */}
                                            <div className="progress-bar-track-wrap">
                                                <div className="progress-bar-track">
                                                    <div 
                                                        className="progress-bar-fill" 
                                                        style={{ width: `${Math.max(scrapeProgress.percent, 3)}%` }}
                                                    >
                                                        <div className="progress-shimmer"></div>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* 3-Metric ETA Cards Grid */}
                                            <div className="eta-metrics-grid">
                                                {/* 1. Estimated Time Remaining (ETA) */}
                                                <div className="metric-card eta-card highlight-metric">
                                                    <div className="metric-icon-wrap">
                                                        <span className="metric-icon">⏱️</span>
                                                    </div>
                                                    <div className="metric-info">
                                                        <span className="metric-label">Estimated Time Remaining</span>
                                                        <strong className="metric-value eta-value">
                                                            {scrapeProgress.eta_text || "Estimating..."}
                                                        </strong>
                                                        <span className="metric-subtext">Dynamic ETA based on live pace</span>
                                                    </div>
                                                </div>

                                                {/* 2. Extraction Speed */}
                                                <div className="metric-card speed-card">
                                                    <div className="metric-icon-wrap">
                                                        <span className="metric-icon">⚡</span>
                                                    </div>
                                                    <div className="metric-info">
                                                        <span className="metric-label">Extraction Speed</span>
                                                        <strong className="metric-value">
                                                            {scrapeProgress.speed || "--"}
                                                        </strong>
                                                        <span className="metric-subtext">Verified leads processed</span>
                                                    </div>
                                                </div>

                                                {/* 3. Elapsed Time */}
                                                <div className="metric-card elapsed-card">
                                                    <div className="metric-icon-wrap">
                                                        <span className="metric-icon">⏳</span>
                                                    </div>
                                                    <div className="metric-info">
                                                        <span className="metric-label">Elapsed Time</span>
                                                        <strong className="metric-value">
                                                            {scrapeProgress.elapsed_text || "0s"}
                                                        </strong>
                                                        <span className="metric-subtext">Time since started</span>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Live Activity Ticker */}
                                            <div className="progress-ticker">
                                                <div className="ticker-pulse-icon">
                                                    <div className="ticker-spinner"></div>
                                                </div>
                                                <div className="ticker-text">
                                                    {statusMessage || scrapeProgress.message || "Extracting listings..."}
                                                </div>
                                            </div>

                                            {/* Anti-detection Reassurance Note */}
                                            <div className="progress-protection-note">
                                                <span>🛡️</span>
                                                <span>Human-simulation active: Natural smooth scrolling & phone verification keeps scraping safe.</span>
                                            </div>
                                        </motion.div>
                                    )}
                                </AnimatePresence>

                                {/* Result Output Container */}
                                <AnimatePresence>
                                    {(status === 'completed' || status === 'error') && (
                                        <motion.div 
                                            id="result-container"
                                            initial={{ opacity: 0, y: 15 }}
                                            animate={{ opacity: 1, y: 0 }}
                                            exit={{ opacity: 0, y: 15 }}
                                        >
                                            {status === 'completed' ? (
                                                <div className="success-box">
                                                    <div className="success-header-row">
                                                        <span className="success-emoji">🎉</span>
                                                        <div>
                                                            <h3>Scraping Completed Successfully!</h3>
                                                            <p className="success-summary-line">
                                                                Extracted <strong>{scrapeProgress.count} verified leads</strong> in <strong>{scrapeProgress.elapsed_text}</strong>.
                                                            </p>
                                                        </div>
                                                    </div>
                                                    <p className="success-desc">{statusMessage}</p>
                                                    <div className="completed-stats-row">
                                                        <span className="stat-pill">⚡ Final Rate: {scrapeProgress.speed}</span>
                                                        <span className="stat-pill">📁 Saved to project root CSV</span>
                                                    </div>
                                                </div>
                                            ) : (
                                                <div className="error-box">
                                                    <h3>⚠️ Notice</h3>
                                                    <p>{statusMessage}</p>
                                                </div>
                                            )}
                                        </motion.div>
                                    )}
                                </AnimatePresence>
                            </div>
                        </div>

                        {/* Right Column: AI Keyword & Market Recommender */}
                        <div className="ai-recommender-column">
                            <AIRecommender 
                                onApply={handleApplyRecommendation} 
                                onToast={handleToast}
                                onOpenAiSettings={() => setShowAiModal(true)}
                                aiConfig={aiConfig}
                            />
                        </div>
                    </div>

                    {/* AI Settings Modal */}
                    <AISettingsModal 
                        isOpen={showAiModal} 
                        onClose={() => setShowAiModal(false)} 
                        aiConfig={aiConfig} 
                        onConfigSaved={(newCfg) => setAiConfig(newCfg)} 
                        onToast={handleToast} 
                    />

                    {/* Notification Toast */}
                    <AnimatePresence>
                        {toastMessage && (
                            <motion.div 
                                className="ai-toast"
                                initial={{ opacity: 0, y: 30, scale: 0.9 }}
                                animate={{ opacity: 1, y: 0, scale: 1 }}
                                exit={{ opacity: 0, y: 20, scale: 0.9 }}
                            >
                                <span style={{ fontSize: '1.2rem' }}>✨</span>
                                <span>{toastMessage}</span>
                            </motion.div>
                        )}
                    </AnimatePresence>

                    {/* App Footer */}
                    <footer className="app-footer">
                        <span>LeadGen Pro • Designed by <strong className="designer-name">Siddhant Sinha</strong></span>
                    </footer>
                </motion.div>
            );
        }

        // Mount React Application
        const rootElement = document.getElementById('root');
        if (ReactDOM.createRoot) {
            ReactDOM.createRoot(rootElement).render(<LeadScraperApp />);
        } else {
            ReactDOM.render(<LeadScraperApp />, rootElement);
        }
    </script>
    {% endraw %}
</body>

</html>
